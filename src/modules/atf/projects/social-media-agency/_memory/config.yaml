# SMA Memory Governance Configuration
# Modeled after LR _memory/config.yaml + persistent-memories.yaml

memory_id: sma-global-memory
version: 1.0.0

# --- Retention Layers ---
# Define what persists and for how long across agent sidecars.

layers:
  - id: "sidecar-core"
    description: "Core instructions, workflow procedures, operating protocols"
    type: "markdown"
    file: "instructions.md"
    persist: true
    ttl: null              # permanent — never expires

  - id: "sidecar-insights"
    description: "Campaign insights, performance patterns, learned preferences"
    type: "markdown"
    file: "memories.md"
    persist: true
    ttl: "90d"             # 90-day retention — campaign cycle

  - id: "sidecar-session"
    description: "Session-specific notes, draft iterations, temporary context"
    type: "markdown"
    persist: false
    ttl: "30d"             # 30-day retention — short-lived

# --- Agent Sidecar Registry ---
# All 7 SMA agents with sidecars.

agents:
  flex-ideator:
    sidecar_path: "_memory/flex-ideator-sidecar/"
    layers: ["sidecar-core", "sidecar-insights"]
  flex-crafter:
    sidecar_path: "_memory/flex-crafter-sidecar/"
    layers: ["sidecar-core", "sidecar-insights"]
  flex-publisher:
    sidecar_path: "_memory/flex-publisher-sidecar/"
    layers: ["sidecar-core", "sidecar-insights"]
  flex-publicist:
    sidecar_path: "_memory/flex-publicist-sidecar/"
    layers: ["sidecar-core", "sidecar-insights"]
  flex-ideation-qa:
    sidecar_path: "_memory/flex-ideation-qa-sidecar/"
    layers: ["sidecar-core"]
  flex-craft-qa:
    sidecar_path: "_memory/flex-craft-qa-sidecar/"
    layers: ["sidecar-core"]
  flex-publish-qa:
    sidecar_path: "_memory/flex-publish-qa-sidecar/"
    layers: ["sidecar-core"]

# --- Module Retention Policies ---

module_retention:
  flex:
    memory_enabled: true
    retention_policy: "campaign-cycle"    # tied to content campaign lifecycle
    cleanup_trigger: "manual"            # no auto-delete — reviewed before purge

# --- Vector Settings (future) ---
# Reserved for when SMA adds vector-based memory search.

vector_settings:
  collection: "sma-signals"
  distance_metric: "cosine"
  dimensions: 3072                       # matches experience_vector_idx
