<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1b6a39",
                        "background-light": "#f6f8f7",
                        "background-dark": "#131f18",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.5rem", "lg": "1rem", "xl": "1.5rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton {
            background: linear-gradient(90deg, #e9f1ec 25%, #d3e4d9 50%, #e9f1ec 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite linear;
        }
        .linear-progress-indeterminate {
            position: relative;
            height: 4px;
            display: block;
            width: 100%;
            background-color: #e9f1ec;
            border-radius: 2px;
            overflow: hidden;
        }
        .linear-progress-indeterminate::after {
            content: '';
            position: absolute;
            background-color: #1b6a39;
            top: 0;
            left: 0;
            bottom: 0;
            will-change: left, right;
            animation: indeterminate 2.1s cubic-bezier(0.65, 0.815, 0.735, 0.395) infinite;
        }
        @keyframes indeterminate {
            0% { left: -35%; right: 100%; }
            60% { left: 100%; right: -90%; }
            100% { left: 100%; right: -90%; }
        }
        .circular-progress {
            animation: rotate 2s linear infinite;
        }
        @keyframes rotate {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100">
<div class="relative flex h-auto min-h-screen w-full flex-col group/design-root overflow-x-hidden">
<div class="layout-container flex h-full grow flex-col">
<!-- Header -->
<header class="flex items-center justify-between border-b border-solid border-primary/10 px-6 py-4 bg-white/80 backdrop-blur-md sticky top-0 z-50">
<div class="flex items-center gap-4 text-primary">
<div class="size-8 bg-primary/10 rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary">account_tree</span>
</div>
<h2 class="text-slate-900 font-bold text-lg leading-tight tracking-tight">LinkRight SMA</h2>
</div>
<div class="flex gap-3">
<button class="flex items-center justify-center rounded-full h-10 w-10 bg-primary/5 hover:bg-primary/10 text-slate-700 transition-colors">
<span class="material-symbols-outlined text-[20px]">notifications</span>
</button>
<button class="flex items-center justify-center rounded-full h-10 w-10 bg-primary/5 hover:bg-primary/10 text-slate-700 transition-colors">
<span class="material-symbols-outlined text-[20px]">account_circle</span>
</button>
</div>
</header>
<!-- Indeterminate Linear Progress -->
<div class="linear-progress-indeterminate"></div>
<div class="flex grow h-full">
<!-- Sidebar (Desktop) -->
<aside class="w-64 border-r border-primary/10 bg-white p-4 hidden md:flex flex-col gap-2">
<div class="flex items-center gap-3 px-4 py-3 rounded-xl bg-primary text-white">
<span class="material-symbols-outlined">dashboard</span>
<p class="text-sm font-semibold">Dashboard</p>
</div>
<div class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-primary/5 transition-colors">
<span class="material-symbols-outlined">description</span>
<p class="text-sm font-medium">Briefs</p>
</div>
<div class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-primary/5 transition-colors">
<span class="material-symbols-outlined">post_add</span>
<p class="text-sm font-medium">Posts</p>
</div>
<div class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 hover:bg-primary/5 transition-colors">
<span class="material-symbols-outlined">settings</span>
<p class="text-sm font-medium">Settings</p>
</div>
</aside>
<!-- Main Content Area -->
<main class="flex-1 p-6 flex flex-col gap-8 max-w-6xl mx-auto w-full">
<!-- Status Overlay Section -->
<div class="flex flex-col items-center justify-center py-12 bg-white rounded-xl border border-primary/10 shadow-sm gap-4">
<svg class="circular-progress w-8 h-8 text-primary" viewbox="25 25 50 50">
<circle class="path stroke-current" cx="50" cy="50" fill="none" r="20" stroke-dasharray="1, 200" stroke-dashoffset="0" stroke-linecap="round" stroke-miterlimit="10" stroke-width="4"></circle>
</svg>
<div class="text-center">
<p class="text-slate-900 font-semibold text-lg">Loading data...</p>
<p class="text-slate-500 text-sm">Fetching latest briefs from Google Sheets...</p>
</div>
</div>
<!-- Pipeline Funnel Skeletons -->
<section>
<div class="flex items-center justify-between mb-4">
<h2 class="text-xl font-bold text-slate-900">Pipeline Funnel</h2>
<div class="h-8 w-24 skeleton rounded-lg"></div>
</div>
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
<div class="p-4 bg-white border border-primary/5 rounded-xl shadow-sm space-y-3">
<div class="h-4 w-1/2 skeleton rounded"></div>
<div class="h-8 w-1/3 skeleton rounded-lg"></div>
<div class="h-32 w-full skeleton rounded-lg"></div>
</div>
<div class="p-4 bg-white border border-primary/5 rounded-xl shadow-sm space-y-3">
<div class="h-4 w-1/2 skeleton rounded"></div>
<div class="h-8 w-1/3 skeleton rounded-lg"></div>
<div class="h-32 w-full skeleton rounded-lg"></div>
</div>
<div class="p-4 bg-white border border-primary/5 rounded-xl shadow-sm space-y-3">
<div class="h-4 w-1/2 skeleton rounded"></div>
<div class="h-8 w-1/3 skeleton rounded-lg"></div>
<div class="h-32 w-full skeleton rounded-lg"></div>
</div>
<div class="p-4 bg-white border border-primary/5 rounded-xl shadow-sm space-y-3">
<div class="h-4 w-1/2 skeleton rounded"></div>
<div class="h-8 w-1/3 skeleton rounded-lg"></div>
<div class="h-32 w-full skeleton rounded-lg"></div>
</div>
</div>
</section>
<!-- Today's Posts Skeletons -->
<section>
<h2 class="text-xl font-bold text-slate-900 mb-4">Today's Posts</h2>
<div class="bg-white rounded-xl border border-primary/10 overflow-hidden">
<div class="divide-y divide-primary/5">
<!-- Skeleton List Item -->
<div class="p-4 flex items-center gap-4">
<div class="size-12 rounded-lg skeleton shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-1/4 skeleton rounded"></div>
<div class="h-3 w-1/2 skeleton rounded"></div>
</div>
<div class="h-6 w-16 skeleton rounded-full"></div>
</div>
<!-- Skeleton List Item -->
<div class="p-4 flex items-center gap-4">
<div class="size-12 rounded-lg skeleton shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-1/3 skeleton rounded"></div>
<div class="h-3 w-1/4 skeleton rounded"></div>
</div>
<div class="h-6 w-16 skeleton rounded-full"></div>
</div>
<!-- Skeleton List Item -->
<div class="p-4 flex items-center gap-4">
<div class="size-12 rounded-lg skeleton shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-1/5 skeleton rounded"></div>
<div class="h-3 w-3/4 skeleton rounded"></div>
</div>
<div class="h-6 w-16 skeleton rounded-full"></div>
</div>
<!-- Skeleton List Item -->
<div class="p-4 flex items-center gap-4">
<div class="size-12 rounded-lg skeleton shrink-0"></div>
<div class="flex-1 space-y-2">
<div class="h-4 w-2/3 skeleton rounded"></div>
<div class="h-3 w-1/3 skeleton rounded"></div>
</div>
<div class="h-6 w-16 skeleton rounded-full"></div>
</div>
</div>
</div>
</section>
</main>
</div>
</div>
</div>
<style>
    /* Inline SVG style for circular progress to avoid external styles */
    .circular-progress circle {
        stroke: currentColor;
        stroke-dasharray: 80, 200;
        stroke-dashoffset: 0;
        animation: dash 1.5s ease-in-out infinite;
    }
    @keyframes dash {
        0% { stroke-dasharray: 1, 200; stroke-dashoffset: 0; }
        50% { stroke-dasharray: 89, 200; stroke-dashoffset: -35; }
        100% { stroke-dasharray: 89, 200; stroke-dashoffset: -124; }
    }
</style>
</body></html>
