<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Settings Skeleton Loading - Material 3</title>
<!-- BEGIN: Scripts and Config -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'm3-surface': '#FEF7FF',
            'm3-outline': '#79747E',
            'm3-surface-variant': '#E7E0EC',
            'm3-primary': '#6750A4',
          },
          animation: {
            'shimmer': 'shimmer 2s infinite linear',
          },
          keyframes: {
            shimmer: {
              '0%': { backgroundPosition: '-200% 0' },
              '100%': { backgroundPosition: '200% 0' },
            },
          },
        },
      },
    }
  </script>
<!-- END: Scripts and Config -->
<!-- BEGIN: Global Styles -->
<style data-purpose="skeleton-animations">
    .shimmer-bg {
      background: linear-gradient(90deg, #E0E0E0 25%, #F0F0F0 50%, #E0E0E0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }
    
    /* Ensure layout fills the screen */
    html, body {
      height: 100%;
      margin: 0;
      background-color: #FEF7FF; /* Material 3 Surface */
      overflow: hidden;
    }
  </style>
<!-- END: Global Styles -->
</head>
<body class="flex flex-row">
<!-- BEGIN: NavigationRail -->
<nav class="w-20 h-full flex flex-col items-center py-4 bg-m3-surface border-r border-gray-200" data-purpose="side-navigation">
<div class="mb-8 w-10 h-10 rounded-full bg-m3-surface-variant flex items-center justify-center">
<div class="w-6 h-6 rounded-md shimmer-bg"></div>
</div>
<div class="flex flex-col gap-8 flex-1">
<div class="flex flex-col items-center gap-1">
<div class="w-12 h-8 rounded-full shimmer-bg"></div>
<div class="w-8 h-2 rounded shimmer-bg"></div>
</div>
<div class="flex flex-col items-center gap-1">
<div class="w-6 h-6 rounded-full shimmer-bg"></div>
<div class="w-8 h-2 rounded shimmer-bg"></div>
</div>
<div class="flex flex-col items-center gap-1">
<div class="w-6 h-6 rounded-full shimmer-bg"></div>
<div class="w-8 h-2 rounded shimmer-bg"></div>
</div>
</div>
</nav>
<!-- END: NavigationRail -->
<!-- BEGIN: MainContentWrapper -->
<div class="flex-1 flex flex-col h-full overflow-hidden">
<!-- BEGIN: TopAppBar -->
<header class="h-16 px-6 flex items-center justify-between bg-m3-surface border-b border-gray-100" data-purpose="top-app-bar">
<div class="flex items-center gap-4">
<div class="w-6 h-6 rounded shimmer-bg"></div>
<div class="w-48 h-6 rounded-md shimmer-bg"></div>
</div>
<div class="w-10 h-10 rounded-full shimmer-bg"></div>
</header>
<!-- END: TopAppBar -->
<!-- BEGIN: SettingsGrid -->
<main class="flex-1 overflow-y-auto p-6 lg:p-10" data-purpose="settings-scroll-area">
<div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-6">
<!-- BEGIN: ScoringCard -->
<section class="p-6 rounded-[28px] border border-gray-300 bg-white flex flex-col gap-6" data-purpose="scoring-card-skeleton">
<div class="w-32 h-6 rounded shimmer-bg"></div> <!-- Title -->
<div class="space-y-4">
<!-- Slider representation -->
<div class="space-y-2">
<div class="w-20 h-3 rounded shimmer-bg"></div>
<div class="w-full h-1 rounded bg-gray-100 relative">
<div class="absolute left-1/2 -top-1.5 w-4 h-4 rounded-full shimmer-bg"></div>
</div>
</div>
<!-- Slider representation 2 -->
<div class="space-y-2">
<div class="w-24 h-3 rounded shimmer-bg"></div>
<div class="w-full h-1 rounded bg-gray-100 relative">
<div class="absolute left-1/4 -top-1.5 w-4 h-4 rounded-full shimmer-bg"></div>
</div>
</div>
</div>
</section>
<!-- END: ScoringCard -->
<!-- BEGIN: ScheduleCard -->
<section class="p-6 rounded-[28px] border border-gray-300 bg-white flex flex-col gap-6" data-purpose="schedule-card-skeleton">
<div class="w-36 h-6 rounded shimmer-bg"></div> <!-- Title -->
<div class="flex flex-wrap gap-2">
<!-- Chip representations -->
<div class="w-16 h-8 rounded-full shimmer-bg"></div>
<div class="w-20 h-8 rounded-full shimmer-bg"></div>
<div class="w-14 h-8 rounded-full shimmer-bg"></div>
<div class="w-18 h-8 rounded-full shimmer-bg"></div>
<div class="w-16 h-8 rounded-full shimmer-bg"></div>
</div>
<div class="w-full h-12 rounded-lg shimmer-bg opacity-50"></div> <!-- Text field rep -->
</section>
<!-- END: ScheduleCard -->
<!-- BEGIN: PillarsCard -->
<section class="p-6 rounded-[28px] border border-gray-300 bg-white flex flex-col gap-6" data-purpose="pillars-card-skeleton">
<div class="w-28 h-6 rounded shimmer-bg"></div> <!-- Title -->
<div class="space-y-3">
<div class="flex items-center gap-3">
<div class="w-10 h-6 rounded-full shimmer-bg opacity-40"></div> <!-- Switch -->
<div class="w-3/4 h-4 rounded shimmer-bg"></div>
</div>
<div class="flex items-center gap-3">
<div class="w-10 h-6 rounded-full shimmer-bg opacity-40"></div> <!-- Switch -->
<div class="w-2/3 h-4 rounded shimmer-bg"></div>
</div>
<div class="flex items-center gap-3">
<div class="w-10 h-6 rounded-full shimmer-bg opacity-40"></div> <!-- Switch -->
<div class="w-1/2 h-4 rounded shimmer-bg"></div>
</div>
</div>
</section>
<!-- END: PillarsCard -->
<!-- BEGIN: ToneCard -->
<section class="p-6 rounded-[28px] border border-gray-300 bg-white flex flex-col gap-6" data-purpose="tone-card-skeleton">
<div class="w-40 h-6 rounded shimmer-bg"></div> <!-- Title -->
<div class="grid grid-cols-2 gap-4">
<!-- Radio-like options -->
<div class="flex items-center gap-2">
<div class="w-5 h-5 rounded-full border-2 border-gray-200"></div>
<div class="w-16 h-3 rounded shimmer-bg"></div>
</div>
<div class="flex items-center gap-2">
<div class="w-5 h-5 rounded-full border-2 border-gray-200"></div>
<div class="w-16 h-3 rounded shimmer-bg"></div>
</div>
<div class="flex items-center gap-2">
<div class="w-5 h-5 rounded-full border-2 border-gray-200"></div>
<div class="w-16 h-3 rounded shimmer-bg"></div>
</div>
<div class="flex items-center gap-2">
<div class="w-5 h-5 rounded-full border-2 border-gray-200"></div>
<div class="w-16 h-3 rounded shimmer-bg"></div>
</div>
</div>
<div class="w-full h-20 rounded-xl border border-gray-200 p-3">
<div class="w-full h-3 rounded shimmer-bg mb-2"></div>
<div class="w-2/3 h-3 rounded shimmer-bg"></div>
</div>
</section>
<!-- END: ToneCard -->
</div>
</main>
<!-- END: SettingsGrid -->
</div>
<!-- END: MainContentWrapper -->
</body></html>
