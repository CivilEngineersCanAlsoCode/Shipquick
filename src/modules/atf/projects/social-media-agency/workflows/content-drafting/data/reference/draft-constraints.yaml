# Draft Constraints — Content Drafting (Workflow B)
# Character limits, formatting rules summary, refinement parameters
# Source: variable-registry.csv (VAR_B01–VAR_B17), formatting-rules.csv

character_limits:
  min: 800                     # VAR_B01
  max: 1600                    # VAR_B02

formatting_summary:
  max_emojis: 3                # VAR_B03
  max_hindi_sentences: 3       # VAR_B04
  max_lines_per_block: 3       # VAR_B05
  fk_grade_max: 7              # VAR_B08
  hashtags: { min: 3, max: 6 } # VAR_B09, VAR_B10
  staircase_formatting: true   # FR01
  no_bold_italic_underline: true # FR03
  one_idea_per_post: true      # FR15

refinement:
  max_iterations: 5            # VAR_B06
  warning_threshold: 3         # VAR_B07 — show warning at this iteration count

duplicate_detection:
  high_threshold: 0.95         # VAR_B11 — near-duplicate
  similar_threshold: 0.80      # VAR_B12 — similar content

style_reference:
  top_performing_posts_count: 5  # VAR_B13
  lookback_days: 30              # VAR_B14

engagement_weights:
  likes: 1                     # VAR_B15
  comments: 3                  # VAR_B16
  shares: 2                    # VAR_B17
  formula: "(likes × 1) + (comments × 3) + (shares × 2)"
