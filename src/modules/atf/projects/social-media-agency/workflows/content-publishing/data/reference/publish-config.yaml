# Publish Config — Content Publishing (Workflow D)
# One-shot publishing, random delay, duplicate guard
# Source: variable-registry.csv (VAR_D01–VAR_D06)

publishing_mode: "one-shot"  # no retries — publish once or fail

timing:
  timezone: "Asia/Kolkata"           # VAR_D05
  default_publish_time: "09:00"      # VAR_D04
  random_delay:
    min_minutes: 0                   # VAR_D01
    max_minutes: 60                  # VAR_D02
    purpose: "prevent pattern detection by LinkedIn algorithm"

limits:
  max_posts_per_day: 1               # VAR_D03 — absolute, no exceptions

visibility: "PUBLIC"                  # VAR_D06

duplicate_guard:
  enabled: true
  check_before_publish: true
  high_threshold: 0.95               # near-duplicate — block publish
  similar_threshold: 0.80            # similar — warn user

status_transitions:
  input_status: "Ready_ToPublish"    # from Workflow C approval
  success_status: "Published"
  failure_status: "Publish_Failed"

notifications:
  telegram:
    on_success: true
    on_failure: true
    include_post_preview: true

data_flow:
  agent_has_db_access: false
  all_data_via: "n8n_webhooks"
  webhook_actions:
    - "fetch_ready_posts"
    - "publish_to_linkedin"
    - "update_post_status"
    - "send_telegram_notification"
