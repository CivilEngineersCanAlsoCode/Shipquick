name: content-ideation
description: "Fetch briefs from Google Sheet, enrich with personal experiences, score using Fibonacci-weighted system (F×8 + P×5 + R×3), and produce a 3-day LinkedIn content schedule saved to MongoDB + Notion."
config_source: "{project-root}/_lr/_config/manifest.yaml"
installed_path: "{project-root}/_lr/flex/workflows/content-ideation"
instructions: "{installed_path}/instructions.md"
validation: "{installed_path}/checklist.md"
template: "{installed_path}/templates/content-plan.template.md"
input_file_patterns:
  briefs:
    pattern: "data/reference/briefs.yaml"
    strategy: FULL_LOAD
  scoring_config:
    pattern: "data/reference/scoring-config.yaml"
    strategy: FULL_LOAD
  experiences:
    pattern: "data/reference/experiences.yaml"
    strategy: FULL_LOAD
