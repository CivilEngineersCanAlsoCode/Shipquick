# Scoring Weights — Content Ideation (Workflow A)
# Fibonacci-weighted scoring system for brief prioritization
# Source: variable-registry.csv (VAR_A01–VAR_A14)

scoring_formula:
  description: "Total = (F × weight_freshness) + (P × weight_personal_experience) + (R × weight_research_quality)"
  weights:
    freshness: 8           # VAR_A01 — Fibonacci weight for freshness
    personal_experience: 5 # VAR_A02 — Fibonacci weight for personal experience
    research_quality: 3    # VAR_A03 — Fibonacci weight for research quality
  scale: fibonacci         # Weights follow Fibonacci sequence: 1, 2, 3, 5, 8, 13, 21

gates:
  individual_minimums:
    freshness: 5            # VAR_A04 — min score to pass
    personal_experience: 3  # VAR_A05 — min score to pass
    research_quality: 2     # VAR_A06 — min score to pass
  total_minimum_percent: 50 # VAR_A07 — min % of max possible score

scoring_parameters:
  max_score_per_factor: 10        # VAR_A08
  top_n_posts_to_select: 3        # VAR_A09
  lookback_days_freshness: 14     # VAR_A10 — days to check for duplicate/recent posts

vector_search:
  similarity_threshold: 0.80      # VAR_A13
  limit_per_query: 3              # VAR_A14

scheduling:
  max_posts_planned_at_once: 3    # VAR_A11
  posts_per_day: 1                # VAR_A12
