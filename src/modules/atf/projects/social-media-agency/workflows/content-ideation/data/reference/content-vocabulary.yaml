# Content Vocabulary — Content Ideation (Workflow A)
# Branded terms, prohibited terms, and voice guidelines
# Source: CONTEXT.md, agent personas, workflow step files

branded_terms:
  personal_brand:
    - "PM by day. Builder by night."
    - "build in public"
    - "ship quick"
  positioning_phrases:
    - "Writing about what I learn."
    - "weekly PM insights and career stories"
  hinglish_markers:
    description: "Romanised Hindi phrases used at emotional peaks only"
    examples:
      - "Yaar kisine nahi bataya tha ye"
      - "Aur sabse bada lesson"
    max_per_post: 3  # FR09

prohibited_terms:
  jargon:
    - "leverage"
    - "synergy"
    - "paradigm shift"
    - "holistic approach"
    - "deep dive"
    - "circle back"
  overused_linkedin:
    - "I'm humbled"
    - "Thrilled to announce"
    - "Excited to share"
    - "Agree?"
  formality:
    - "herein"
    - "aforementioned"
    - "utilize"  # use "use" instead

voice_guidelines:
  tone: "conversational, authentic, first-person"
  readability: "FK Grade 7 — ad copy style"
  perspective: "lessons from real experience, not advice-giving"
  hooks: "data-driven or counter-intuitive preferred"
