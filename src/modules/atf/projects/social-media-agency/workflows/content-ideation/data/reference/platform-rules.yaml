# Platform Rules — Content Ideation (Workflow A)
# LinkedIn-specific constraints applied during ideation scoring
# Source: config.yaml, variable-registry.csv, formatting-rules.csv

linkedin:
  character_limits:
    min: 800               # VAR_B01 — minimum post length
    max: 1600              # VAR_B02 — maximum post length
  readability:
    fk_grade_target: 7     # VAR_B08 — Flesch-Kincaid max grade level
    style: "ad copy, layman language, no jargon"  # FR10
  formatting:
    max_emojis: 3          # VAR_B03 / FR08
    max_hindi_sentences: 3 # VAR_B04 / FR09
    max_lines_per_block: 3 # VAR_B05 / FR02
    hashtags_min: 3        # VAR_B09
    hashtags_max: 6        # VAR_B10
    hashtags_placement: "end only"  # FR14
  structure:
    one_idea_per_post: true         # FR15
    staircase_formatting: true      # FR01
    whitespace_breathing_room: true # FR16
  typography:
    bold_italic_underline: false    # FR03
    dashes: "replace with full stops and commas"  # FR04
    bullets_format: "space-hyphen-space"           # FR05
    numbered_lists: "digit-period-space"           # FR06
    flows_format: "arrow with spaces"              # FR07
  footer:
    positioning_line: true   # FR12 — who you are + value
    follow_line: true        # FR13 — follow invitation
  duplicate_detection:
    high_threshold: 0.95     # VAR_B11 — near-duplicate flag
    similar_threshold: 0.80  # VAR_B12 — similar content flag

constraints:
  max_posts_per_day: 1
  platforms_v1: [linkedin]
