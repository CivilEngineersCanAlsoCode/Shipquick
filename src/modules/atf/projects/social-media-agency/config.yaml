# Flex Module Configuration — Social Media Agency (SMA)

module_id: flex
enabled: true
priority: 2

features:
  content_ideation: true
  content_drafting: true
  content_formatting: true
  content_review: true
  content_publishing: true
  analytics_review: true
  viral_insight_extraction: true

data_layer:
  primary_db: "mongodb"
  vector_search: true
  embedding_model: "text-embedding-001"
  embedding_dims: 3072
  similarity_threshold: 0.80

external_integrations:
  n8n_webhook_base: "${N8N_WEBHOOK_BASE}"
  google_sheets: true
  notion: true
  linkedin_api: false
  chatgpt_actions: true
  chrome_extension: true

constraints:
  max_posts_planned: 3
  max_posts_per_day: 1
  platforms_v1:
    - linkedin
  character_limit_linkedin: 1600
  fk_grade_target: 7
  max_emojis: 3
  max_hindi_sentences: 3
  hashtags_range: [3, 6]

governance:
  task_tracker: "beads"
  workflow_style: "interactive"
  agent_has_db_access: false
  all_data_via: "n8n_webhooks"
