code: atf
name: "ATF: AutoFlow"
header: "AutoFlow — 7-Agent Factory Floor for n8n Workflow Automation"
subheader: "Production-quality n8n automations in 20 minutes through coordinated AI specialists"
default_selected: false

# Variables from Core Config inserted:
## user_name
## communication_language
## document_output_language
## output_folder

n8n_instance_url:
  prompt: "What is your n8n instance URL?"
  default: "http://localhost:5678"
  result: "{value}"

pinchtab_url:
  prompt: "What is your PinchTab browser automation URL?"
  default: "http://localhost:9867"
  result: "{value}"

chromadb_url:
  prompt: "What is your ChromaDB URL for learning capture?"
  default: "http://localhost:8000"
  result: "{value}"

atf_output_folder:
  prompt: "Where should AutoFlow artifacts be stored?"
  default: "{output_folder}/atf-artifacts"
  result: "{project-root}/{value}"

preferred_cost_tier:
  prompt: "What is your preferred tool cost tier?"
  default: "free"
  result: "{value}"
  single-select:
    - value: "free"
      label: "Free - Prefer free/open-source tools only"
    - value: "freemium"
      label: "Freemium - Free tiers of paid services OK"
    - value: "paid"
      label: "Paid - Any tool if it's the best fit"
