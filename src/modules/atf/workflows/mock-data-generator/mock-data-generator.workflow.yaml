# AutoFlow: Mock Data Generator Workflow
# Create realistic test data from I/O specs
# Type: Feature (Specialized)

name: mock-data-generator
description: Generate realistic mock data from I/O specifications
version: "1.0.0"
type: feature

trigger:
  type: workflow
  source: create-automation
  description: Called by Blueprint during I/O specification phase

# -------------------------------------------------------------------
# Input / Output Schemas
# -------------------------------------------------------------------
input_schema:
  required:
    io_specification:
      type: object
      description: I/O specification from Blueprint
  optional:
    edge_cases:
      type: array
      items: string
      description: Specific edge cases to cover
    sample_data:
      type: object
      description: Sample real data for reference

output_schema:
  mock_data_set:
    type: object
    properties:
      happy_path:
        type: array
        description: Mock data for normal operation
      edge_cases:
        type: array
        description: Mock data for boundary conditions
      error_cases:
        type: array
        description: Mock data that should trigger errors
    description: Complete mock data set with inputs and expected outputs

# -------------------------------------------------------------------
# Steps
# -------------------------------------------------------------------
steps:

  # ---- Step 1: Parse I/O Spec ----
  - id: parse_io_spec
    name: Parse I/O Spec
    description: Extract input schemas and output expectations
    nodes:
      - id: workflow_trigger
        type: n8n-nodes-base.executeWorkflowTrigger
        description: Entry point

      - id: extract_schemas
        type: n8n-nodes-base.code
        description: Parse I/O spec into input schemas and output expectations
        config:
          language: javascript

      - id: identify_data_types
        type: n8n-nodes-base.code
        description: Identify data types and constraints per field

  # ---- Step 2: Generate Happy Path ----
  - id: generate_happy_path
    name: Generate Happy Path
    description: Create mock data for normal operation
    nodes:
      - id: happy_path_generator
        type: "@n8n/n8n-nodes-langchain.agent"
        description: Generate realistic mock data matching schemas
        config:
          agent_type: toolsAgent
          system_prompt: blueprint-persona

      - id: validate_happy_data
        type: n8n-nodes-base.code
        description: Validate generated data matches schema constraints

  # ---- Step 3: Generate Edge Cases ----
  - id: generate_edge_cases
    name: Generate Edge Cases
    description: Create data for boundary conditions and errors
    nodes:
      - id: edge_case_generator
        type: "@n8n/n8n-nodes-langchain.agent"
        description: Generate boundary condition and error case data
        config:
          agent_type: toolsAgent
          system_prompt: blueprint-persona

      - id: include_user_cases
        type: n8n-nodes-base.merge
        description: Merge AI-generated with user-specified edge cases

  # ---- Step 4: Validate Mock Data ----
  - id: validate_mock_data
    name: Validate Mock Data
    description: Ensure mock data matches schema definitions
    nodes:
      - id: schema_validation
        type: n8n-nodes-base.code
        description: Validate all mock data against original schemas
        config:
          language: javascript

      - id: completeness_check
        type: n8n-nodes-base.code
        description: Ensure all fields and types are covered

      - id: format_output
        type: n8n-nodes-base.set
        description: Package mock_data_set output

# -------------------------------------------------------------------
# Error Handling
# -------------------------------------------------------------------
error_handling:
  global_timeout: 120000  # 2 minutes
  on_unhandled_error:
    action: return_minimal
    message: "Mock data generation failed — using minimal defaults"
