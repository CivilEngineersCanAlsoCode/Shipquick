# AutoFlow: Status Check Workflow
# Check current project progress and blockers
# Type: Utility (Support)

name: status-check
description: Check current project progress and blockers
version: "1.0.0"
type: utility

trigger:
  type: command
  source: "[WS]"
  description: Any agent can trigger via shared [WS] command

# -------------------------------------------------------------------
# Input / Output Schemas
# -------------------------------------------------------------------
input_schema:
  required:
    project_id:
      type: string
      description: Project ID or context identifier
  optional:
    specific_stage:
      type: string
      enum: [scout, blueprint, forge-master, assembler, foreman, welder, inspector]
      description: Specific agent/stage to check

output_schema:
  status_report:
    type: object
    properties:
      project_id: { type: string }
      current_stage: { type: string }
      stages:
        type: array
        items:
          type: object
          properties:
            agent: { type: string }
            status: { type: string, enum: [completed, in-progress, pending, failed] }
            started_at: { type: string }
            completed_at: { type: string }
      blockers:
        type: array
        items: { type: string }
      progress_pct:
        type: integer
    description: Assembly line status report

# -------------------------------------------------------------------
# Steps
# -------------------------------------------------------------------
steps:

  # ---- Step 1: Load Project State ----
  - id: load_project_state
    name: Load Project State
    description: Query Beads for current project status
    nodes:
      - id: workflow_trigger
        type: n8n-nodes-base.executeWorkflowTrigger
        description: Entry point

      - id: query_project
        type: n8n-nodes-base.code
        description: Load project state from Beads context store
        config:
          language: javascript

      - id: validate_project
        type: n8n-nodes-base.if
        description: Check if project exists
        config:
          conditions:
            - field: project
              operation: isNotEmpty

  # ---- Step 2: Assembly Line Progress ----
  - id: assembly_progress
    name: Assembly Line Progress
    description: Show which agents have completed, which are pending
    nodes:
      - id: map_stages
        type: n8n-nodes-base.code
        description: Map each agent stage to completed/in-progress/pending
        config:
          language: javascript
          stages:
            - scout
            - blueprint
            - forge-master
            - assembler
            - foreman
            - welder
            - inspector

      - id: calculate_progress
        type: n8n-nodes-base.code
        description: Calculate overall progress percentage

  # ---- Step 3: Surface Blockers ----
  - id: surface_blockers
    name: Surface Blockers
    description: Identify and report any blockers
    nodes:
      - id: check_failures
        type: n8n-nodes-base.code
        description: Check for failed stages or stalled progress

      - id: check_dependencies
        type: n8n-nodes-base.code
        description: Check for missing dependencies or credentials

  # ---- Step 4: Report ----
  - id: report
    name: Report
    description: Present status in factory floor format
    nodes:
      - id: format_report
        type: n8n-nodes-base.code
        description: Format status as factory floor assembly line display
        config:
          language: javascript

      - id: format_output
        type: n8n-nodes-base.set
        description: Package status_report output

# -------------------------------------------------------------------
# Error Handling
# -------------------------------------------------------------------
error_handling:
  global_timeout: 30000  # 30 seconds
  on_unhandled_error:
    action: return_unknown
    message: "Could not retrieve project status"
