# AutoFlow: Node Discovery Workflow
# Find and rank n8n nodes for requirements
# Type: Feature (Specialized)

name: node-discovery
description: Discover and compare n8n nodes for user requirements
version: "1.0.0"
type: feature

trigger:
  type: workflow
  source: create-automation
  description: Called by Forge Master during pipeline, or ad-hoc

# -------------------------------------------------------------------
# Input / Output Schemas
# -------------------------------------------------------------------
input_schema:
  required:
    requirement:
      type: string
      description: What the user needs (platform, action, data type)
    cost_tier:
      type: string
      enum: [free, low, medium, high]
      description: Preferred cost tier
  optional:
    specific_platforms:
      type: array
      items: string
      description: Specific platform requirements
    known_preferences:
      type: array
      items: string
      description: Known node preferences from user

output_schema:
  ranked_nodes:
    type: array
    items:
      type: object
      properties:
        node_type: { type: string }
        name: { type: string }
        source: { type: string, enum: [official, community] }
        cost: { type: string }
        reliability: { type: string, enum: [high, medium, low] }
        complexity: { type: string, enum: [simple, moderate, complex] }
        rationale: { type: string }
    description: Ranked node options with comparison rationale

# -------------------------------------------------------------------
# Steps
# -------------------------------------------------------------------
steps:

  # ---- Step 1: Parse Requirement ----
  - id: parse_requirement
    name: Parse Requirement
    description: Extract what the user needs (platform, action, data type)
    nodes:
      - id: workflow_trigger
        type: n8n-nodes-base.executeWorkflowTrigger
        description: Entry point

      - id: extract_intent
        type: "@n8n/n8n-nodes-langchain.agent"
        description: Parse requirement into platform, action, data type
        config:
          agent_type: toolsAgent
          system_prompt: forge-master-persona

      - id: structure_query
        type: n8n-nodes-base.set
        description: Structure query for registry searches

  # ---- Step 2: Registry Search ----
  - id: registry_search
    name: Registry Search
    description: Query n8n MCP for official nodes
    nodes:
      - id: search_official
        type: n8n-nodes-base.httpRequest
        description: Query n8n official node registry
        config:
          method: GET
          url: "{{ $env.N8N_REGISTRY_URL }}/nodes"

      - id: filter_matches
        type: n8n-nodes-base.code
        description: Filter registry results by platform and action
        config:
          language: javascript

  # ---- Step 3: Community Search ----
  - id: community_search
    name: Community Search
    description: Check community node registries
    nodes:
      - id: search_community
        type: n8n-nodes-base.httpRequest
        description: Query npm for n8n community nodes
        config:
          method: GET
          url: "https://registry.npmjs.org/-/v1/search"

      - id: filter_community
        type: n8n-nodes-base.code
        description: Filter community nodes by relevance and downloads
        config:
          language: javascript

  # ---- Step 4: Compare & Rank ----
  - id: compare_rank
    name: Compare & Rank
    description: Compare alternatives on cost, reliability, complexity
    nodes:
      - id: merge_results
        type: n8n-nodes-base.merge
        description: Merge official and community search results

      - id: score_nodes
        type: n8n-nodes-base.code
        description: Score each node on cost, reliability, complexity
        config:
          language: javascript
          scoring_weights:
            cost: 0.4
            reliability: 0.35
            complexity: 0.25

      - id: apply_cost_filter
        type: n8n-nodes-base.filter
        description: Filter out nodes exceeding user's cost tier

  # ---- Step 5: Recommend ----
  - id: recommend
    name: Recommend
    description: Present ranked options with rationale
    nodes:
      - id: generate_rationale
        type: "@n8n/n8n-nodes-langchain.agent"
        description: Generate human-readable rationale for top picks
        config:
          agent_type: toolsAgent
          system_prompt: forge-master-persona

      - id: format_output
        type: n8n-nodes-base.set
        description: Format ranked_nodes output array

# -------------------------------------------------------------------
# Error Handling
# -------------------------------------------------------------------
error_handling:
  global_timeout: 120000  # 2 minutes
  on_unhandled_error:
    action: return_empty
    message: "Node discovery failed — manual selection required"
