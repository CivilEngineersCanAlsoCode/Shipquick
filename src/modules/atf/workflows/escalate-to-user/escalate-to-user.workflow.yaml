# AutoFlow: Escalate to User Workflow
# Human-in-the-loop decision gate
# Type: Utility (Support)

name: escalate-to-user
description: Human-in-the-loop decision gate
version: "1.0.0"
type: utility

trigger:
  type: command
  source: "[ES]"
  description: Any agent can trigger via shared [ES] command

# -------------------------------------------------------------------
# Input / Output Schemas
# -------------------------------------------------------------------
input_schema:
  required:
    decision_context:
      type: string
      description: What needs deciding and why
    options:
      type: array
      items:
        type: object
        properties:
          label: { type: string }
          description: { type: string }
          trade_offs: { type: string }
      description: Options with trade-offs
  optional:
    recommended_option:
      type: string
      description: Which option the system recommends
    urgency:
      type: string
      enum: [low, medium, high, critical]
      default: medium
      description: Urgency level
    requesting_agent:
      type: string
      description: Which agent triggered escalation

output_schema:
  user_decision:
    type: string
    description: User's chosen option label
  additional_input:
    type: string
    description: Any additional context the user provided
  decided_at:
    type: string
    description: Timestamp of user's decision

# -------------------------------------------------------------------
# Steps
# -------------------------------------------------------------------
steps:

  # ---- Step 1: Frame Decision ----
  - id: frame_decision
    name: Frame Decision
    description: Present what needs deciding and why
    nodes:
      - id: workflow_trigger
        type: n8n-nodes-base.executeWorkflowTrigger
        description: Entry point

      - id: build_context
        type: n8n-nodes-base.code
        description: Build clear decision context with agent history
        config:
          language: javascript

      - id: format_question
        type: n8n-nodes-base.code
        description: Format the decision as a clear, concise question

  # ---- Step 2: Show Options ----
  - id: show_options
    name: Show Options
    description: Display options with trade-offs
    nodes:
      - id: format_options
        type: n8n-nodes-base.code
        description: Format each option with label, description, and trade-offs

      - id: highlight_recommendation
        type: n8n-nodes-base.if
        description: Add recommendation highlight if one exists
        config:
          conditions:
            - field: recommended_option
              operation: isNotEmpty

      - id: compose_message
        type: n8n-nodes-base.code
        description: Compose final user-facing message with all options

  # ---- Step 3: Wait for Input ----
  - id: wait_for_input
    name: Wait for Input
    description: Halt and wait for user response
    nodes:
      - id: send_to_user
        type: n8n-nodes-base.respondToWebhook
        description: Send decision prompt to user interface

      - id: wait_response
        type: n8n-nodes-base.wait
        description: Wait for user to respond
        config:
          resume_type: webhook
          timeout_ms: 3600000  # 1 hour

      - id: timeout_check
        type: n8n-nodes-base.if
        description: Check if user responded or timed out

  # ---- Step 4: Return Decision ----
  - id: return_decision
    name: Return Decision
    description: Pass user's choice back to requesting agent
    nodes:
      - id: parse_response
        type: n8n-nodes-base.code
        description: Parse user's response and validate against options

      - id: package_decision
        type: n8n-nodes-base.set
        description: Package user_decision, additional_input, decided_at

      - id: return_to_caller
        type: n8n-nodes-base.set
        description: Return decision to the calling workflow/agent

# -------------------------------------------------------------------
# Error Handling
# -------------------------------------------------------------------
error_handling:
  global_timeout: 3600000  # 1 hour (waiting for human)
  on_timeout:
    action: use_recommendation
    fallback: "No user response — using recommended option if available"
  on_unhandled_error:
    action: log_and_continue
    message: "Escalation failed — logging for manual review"
