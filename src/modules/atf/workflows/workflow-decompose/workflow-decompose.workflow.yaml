# AutoFlow: Workflow Decompose
# Break complex workflows into modular sub-workflows
# Type: Feature (Specialized)

name: workflow-decompose
description: Decompose complex workflows into modular sub-workflows
version: "1.0.0"
type: feature

trigger:
  type: workflow
  source: create-automation
  description: Called by Assembler during architecture design

# -------------------------------------------------------------------
# Input / Output Schemas
# -------------------------------------------------------------------
input_schema:
  required:
    workflow_design:
      type: object
      description: Workflow design from architecture phase
    node_selections:
      type: array
      description: Node selections from Forge Master
  optional:
    max_nodes_per_sub:
      type: integer
      default: 15
      description: Max nodes per sub-workflow

output_schema:
  orchestrator:
    type: object
    description: Orchestrator workflow that calls sub-workflows
  sub_workflows:
    type: array
    items:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        nodes: { type: array }
        connections: { type: object }
    description: Array of sub-workflow definitions
  architecture_doc:
    type: object
    description: Architecture diagram with sticky notes

# -------------------------------------------------------------------
# Steps
# -------------------------------------------------------------------
steps:

  # ---- Step 1: Analyze Complexity ----
  - id: analyze_complexity
    name: Analyze Complexity
    description: Assess total nodes, connections, platform count
    nodes:
      - id: workflow_trigger
        type: n8n-nodes-base.executeWorkflowTrigger
        description: Entry point

      - id: count_metrics
        type: n8n-nodes-base.code
        description: Count total nodes, connections, unique platforms
        config:
          language: javascript

      - id: needs_decomposition
        type: n8n-nodes-base.if
        description: Check if decomposition is needed (>15 nodes)
        config:
          conditions:
            - field: total_nodes
              operation: greaterThan
              value: "{{ $json.max_nodes_per_sub || 15 }}"

  # ---- Step 2: Identify Boundaries ----
  - id: identify_boundaries
    name: Identify Boundaries
    description: Find natural sub-workflow boundaries
    nodes:
      - id: boundary_analysis
        type: "@n8n/n8n-nodes-langchain.agent"
        description: Identify logical groupings by platform, stage, data domain
        config:
          agent_type: toolsAgent
          system_prompt: assembler-persona

      - id: define_groups
        type: n8n-nodes-base.code
        description: Split nodes into groups respecting max size
        config:
          language: javascript

  # ---- Step 3: Design Orchestrator ----
  - id: design_orchestrator
    name: Design Orchestrator
    description: Create orchestrator that calls sub-workflows
    nodes:
      - id: orchestrator_builder
        type: n8n-nodes-base.code
        description: Build orchestrator workflow with executeWorkflow nodes
        config:
          language: javascript

      - id: add_error_handling
        type: n8n-nodes-base.code
        description: Add error branches and retry logic to orchestrator

  # ---- Step 4: Define Connections ----
  - id: define_connections
    name: Define Connections
    description: Map data flow between orchestrator and sub-workflows
    nodes:
      - id: map_data_flow
        type: n8n-nodes-base.code
        description: Define input/output mappings between workflows
        config:
          language: javascript

      - id: validate_flow
        type: n8n-nodes-base.code
        description: Validate no data is lost between boundaries

  # ---- Step 5: Document Architecture ----
  - id: document_architecture
    name: Document Architecture
    description: Add sticky notes and architecture diagram
    nodes:
      - id: generate_sticky_notes
        type: "@n8n/n8n-nodes-langchain.agent"
        description: Generate descriptive sticky notes for every node
        config:
          agent_type: toolsAgent
          system_prompt: assembler-persona

      - id: build_diagram
        type: n8n-nodes-base.code
        description: Build architecture overview as structured doc

      - id: format_output
        type: n8n-nodes-base.set
        description: Package orchestrator, sub_workflows, and architecture_doc

# -------------------------------------------------------------------
# Error Handling
# -------------------------------------------------------------------
error_handling:
  global_timeout: 180000  # 3 minutes
  on_unhandled_error:
    action: return_single
    message: "Decomposition failed — returning as single workflow"
